server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 100m;

  location = /docs {
    return 302 /docs/;
  }

  location ^~ /docs/ {
    try_files $uri $uri/ /docs/index.html;
  }

  # React SPA
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Same app behind an external /ai/dev prefix. This also makes direct
  # origin checks work when the upstream proxy keeps the prefix intact.
  location ^~ /ai/dev/api/ {
    rewrite ^/ai/dev/api/(.*)$ /api/$1 break;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
  }

  location ^~ /ai/dev/sso/ {
    proxy_pass http://host.docker.internal:18080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
  }

  location = /ai/dev/getClientInfo {
    proxy_pass http://host.docker.internal:18080/getClientInfo;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
  }

  location ^~ /ai/dev/chat-widget/ {
    rewrite ^/ai/dev/chat-widget/(.*)$ /$1 break;
    proxy_pass http://host.docker.internal:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
  }

  location = /ai/dev/assistant/widget.js {
    proxy_pass http://host.docker.internal:3001/widget/chat-widget.js;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
  }

  location ^~ /ai/dev/assistant-api/ {
    rewrite ^/ai/dev/assistant-api/(.*)$ /$1 break;
    proxy_pass http://host.docker.internal:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
  }

  location ^~ /ai/dev/uploads/ {
    rewrite ^/ai/dev/uploads/(.*)$ /uploads/$1 break;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
  }

  location ^~ /ai/dev/share-assets/ {
    rewrite ^/ai/dev/share-assets/(.*)$ /share-assets/$1 break;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    sub_filter_once off;
    sub_filter '/share-assets/' '/ai/dev/share-assets/';
    sub_filter '"/uploads/' '"/ai/dev/uploads/';
    sub_filter "'/uploads/" "'/ai/dev/uploads/";
  }

  location = /ai/dev/docs {
    return 302 /ai/dev/docs/;
  }

  location ^~ /ai/dev/docs/ {
    rewrite ^/ai/dev/docs/?(.*)$ /docs/$1 break;
    try_files $uri $uri/ /docs/index.html;
    sub_filter_once off;
    sub_filter 'href="/"' 'href="/ai/dev/"';
    sub_filter 'href="/docs/' 'href="/ai/dev/docs/';
    sub_filter 'src="/docs/' 'src="/ai/dev/docs/';
    sub_filter 'content="/docs/' 'content="/ai/dev/docs/';
  }

  location ^~ /ai/dev/ {
    rewrite ^/ai/dev/?(.*)$ /$1 break;
    try_files $uri $uri/ /index.html;
  }

  # API proxy (包含 SSE)
  location /api/ {
    proxy_pass http://api:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
  }

  # uploaded files proxy
  location /uploads/ {
    proxy_pass http://api:3000/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
  }

  # share snapshot assets proxy
  location /share-assets/ {
    proxy_pass http://api:3000/share-assets/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    sub_filter_once off;
    sub_filter '/share-assets/' '/ai/dev/share-assets/';
    sub_filter '"/uploads/' '"/ai/dev/uploads/';
    sub_filter "'/uploads/" "'/ai/dev/uploads/";
  }

  # standalone knowledge-base chat widget
  location /chat-widget/ {
    rewrite ^/chat-widget/(.*)$ /$1 break;
    proxy_pass http://host.docker.internal:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
  }

  location = /assistant/widget.js {
    proxy_pass http://host.docker.internal:3001/widget/chat-widget.js;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
  }

  location ^~ /assistant-api/ {
    rewrite ^/assistant-api/(.*)$ /$1 break;
    proxy_pass http://host.docker.internal:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
  }

  # unified auth bridge proxy
  location = /getClientInfo {
    proxy_pass http://host.docker.internal:18080/getClientInfo;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
  }

  location /sso/ {
    proxy_pass http://host.docker.internal:18080/ai/dev/sso/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
  }
}
